[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200
[[redirects]]
  from = "/api/bookings/cancel"
  to = "/.netlify/functions/booking-cancel"
  status = 200
[[redirects]]
  from = "/api/whatsapp"
  to = "/.netlify/functions/whatsapp"
  status = 200
[[redirects]]
  from = "/api/place"
  to = "/.netlify/functions/place"
  status = 200
[[redirects]]
  from = "/api/google-reviews"
  to = "/.netlify/functions/google-reviews"
  status = 200
